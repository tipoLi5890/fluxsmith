[workspace]
resolver = "2"
members = ["crates/*", "src-tauri"]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v5", "v4", "serde"] }
sha2 = "0.10"
tempfile = "3"
regex = "1"

[profile.ci]
inherits = "release"
debug-assertions = true
overflow-checks = true
