name: ci
on:
  pull_request:
  push:
    branches: [main]
    # A release tag runs the full suite too, so the tag commit carries its own check status
    # (ci.md section 5: a release tag runs every PR job). Packaging lives in release.yml.
    tags: ["v*"]
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *" # nightly

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "clippy, rustfmt" }
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: pnpm exec tsc --noEmit
      - run: pnpm lint:emoji
      - run: pnpm lint:design
      - run: pnpm lint:cache

  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: cargo test --workspace --exclude fluxsmith-app

      - run: cargo test -p fluxsmith-app --lib
        if: runner.os != 'Windows'

      # The Windows unit-test harness needs a manifest, and cargo cannot give it one.
      # The loader states the problem itself under loader snaps:
      #
      #   LdrpReportError - ERROR: Locating export "TaskDialogIndirect" for DLL
      #   "...\deps\fluxsmith_app-<hash>.exe" failed with status: 0xc0000139
      #
      # TaskDialogIndirect exists only in side-by-side Common-Controls 6, while
      # System32 carries comctl32 5.82, so the process dies before its first test.
      # The import is not ours - nothing in src/ calls TaskDialog - it arrives through
      # the dialog plugin's dependency chain. tauri-build embeds an application
      # manifest with `rustc-link-arg-bins`, which never reaches a test binary, which
      # is why `build` has always passed here while this step never could.
      #
      # Two alternatives were measured and rejected: `rustc-link-arg-tests` covers
      # tests/ only and cargo rejects it outright for a package with no test target,
      # and plain `rustc-link-arg` does fix the harness but then collides with the
      # bin's own manifest resource (link.exe 1123). An external `<module>.manifest`
      # beside the executable is read by the loader whenever the module has no
      # embedded one, which a Rust test harness never has, so it fixes the harness
      # and touches neither the product nor any other target.
      - name: cargo test -p fluxsmith-app --lib (external Common-Controls 6 manifest)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $lines = cargo test -p fluxsmith-app --lib --no-run --message-format=json
          $exe = $lines | ForEach-Object { try { $_ | ConvertFrom-Json } catch { $null } } |
            Where-Object { $_.reason -eq 'compiler-artifact' -and $_.executable -and $_.target.name -eq 'fluxsmith_app' } |
            Select-Object -Last 1 -ExpandProperty executable
          if (-not $exe) { Write-Error "could not find the fluxsmith_app test executable"; exit 1 }
          $xml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><assembly xmlns="urn:schemas-microsoft-com:asm.v1" manifestVersion="1.0"><dependency><dependentAssembly><assemblyIdentity type="win32" name="Microsoft.Windows.Common-Controls" version="6.0.0.0" processorArchitecture="*" publicKeyToken="6595b64144ccf1df" language="*"/></dependentAssembly></dependency></assembly>'
          [IO.File]::WriteAllText("$exe.manifest", $xml)
          & $exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - run: pnpm test

  conformance:
    # Needs a real KiCad (tests/conformance/env.toml), so it can only run on a self-hosted
    # runner. Two guards, both deliberate:
    #
    #   vars.SELF_HOSTED_RUNNER - unset until a runner with the [self-hosted, macOS, kicad]
    #     labels is actually registered. Without it this job would queue with nothing to pick
    #     it up and then fail, on every push and every nightly. Set the repository variable to
    #     'true' once a runner exists; until then the parity gate is NOT running, which is a
    #     known gap rather than a passing check.
    #   head.repo == this repo - a self-hosted runner on a public repository must never
    #     execute code from a fork. Everything else that reaches here is push-to-main,
    #     schedule or a manual dispatch, all of which already require write access.
    #
    # Do not loosen either one.
    if: >-
      vars.SELF_HOSTED_RUNNER == 'true' &&
      (github.event_name != 'pull_request' ||
       (github.event.pull_request.head.repo.full_name == github.repository &&
        contains(github.event.pull_request.title, '[engine]')))
    runs-on: [self-hosted, macOS, kicad]
    # FLUXSMITH_CONFORMANCE=required turns every "KiCad is absent, skip" branch into a
    # hard failure, so the tests hosted CI skips cannot pass silently here.
    env:
      FLUXSMITH_CONFORMANCE: required
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --workspace --exclude fluxsmith-app -- --include-ignored oracle
      - run: tests/golden-set/build.sh

  golden-nightly:
    # Real-model golden subset on the self-hosted runner (needs a configured provider + KiCad).
    # Schedule and manual dispatch only, so it never runs for a fork. Cost-capped and never
    # blocking: the criteria are read from the uploaded run JSON, not from the job status.
    if: >-
      vars.SELF_HOSTED_RUNNER == 'true' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: [self-hosted, macOS, kicad]
    continue-on-error: true
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: pnpm install --frozen-lockfile
      - run: cargo build -p fluxsmith-cli
      - run: pnpm tauri build --debug --no-bundle
      - run: pnpm golden:run --subset nightly --n 1 --budget-usd 5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: golden-nightly-${{ github.run_id }}
          path: tests/golden-set/runs/*.json
          if-no-files-found: warn
          retention-days: 30

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build --debug --no-bundle
