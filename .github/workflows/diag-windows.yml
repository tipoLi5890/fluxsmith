# TEMPORARY DIAGNOSTIC -- delete once a fix lands.
#
# Cause, from the loader itself under loader snaps:
#   LdrpReportError - ERROR: Locating export "TaskDialogIndirect" for DLL
#   "...\deps\fluxsmith_app-<hash>.exe" failed with status: 0xc0000139
# TaskDialogIndirect is only in side-by-side Common-Controls 6; System32 carries
# comctl32 5.82. The test harness has no manifest asking for 6, because
# tauri-build embeds one via rustc-link-arg-bins, which never reaches a test
# binary, and rustc-link-arg-tests is not an alternative: it covers tests/ only,
# and cargo rejects it for a package with no test target.
#
# Two candidates, measured here instead of on main. No here-strings anywhere:
# PowerShell wants the terminator at column 1 and YAML block scalars forbid it,
# which is what broke the previous revision of this file.
name: diag-windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidates:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo --version
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      - name: Candidate A - an external .manifest beside the test executable
        continue-on-error: true
        shell: pwsh
        run: |
          $lines = cargo test -p fluxsmith-app --lib --no-run --message-format=json
          $exe = $lines | ForEach-Object { try { $_ | ConvertFrom-Json } catch { $null } } |
            Where-Object { $_.reason -eq 'compiler-artifact' -and $_.executable -and $_.target.name -eq 'fluxsmith_app' } |
            Select-Object -Last 1 -ExpandProperty executable
          Write-Host "exe: $exe"
          $xml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><assembly xmlns="urn:schemas-microsoft-com:asm.v1" manifestVersion="1.0"><dependency><dependentAssembly><assemblyIdentity type="win32" name="Microsoft.Windows.Common-Controls" version="6.0.0.0" processorArchitecture="*" publicKeyToken="6595b64144ccf1df" language="*"/></dependentAssembly></dependency></assembly>'
          [IO.File]::WriteAllText("$exe.manifest", $xml)
          Write-Host "wrote $exe.manifest"
          & $exe --list 2>&1 | Select-Object -First 3 | Out-String | Write-Host
          $code = $LASTEXITCODE
          Write-Host ("A EXIT: {0} (0x{1:x8})" -f $code, $code)
          if ($code -eq 0) { Write-Host "A WORKS" } else { Write-Host "A FAILS" }

      - name: Candidate B - rustc-link-arg for all targets, and does the bin still link
        continue-on-error: true
        shell: pwsh
        run: |
          $b64 = ''
          [IO.File]::WriteAllBytes("src-tauri/build.rs", [Convert]::FromBase64String($b64))
          Write-Host "--- patched build.rs ---"
          Get-Content src-tauri/build.rs | ForEach-Object { Write-Host $_ }
          Write-Host "--- B1: does the lib test harness run now? ---"
          cargo test -p fluxsmith-app --lib 2>&1 | Select-Object -Last 12 | Out-String | Write-Host
          Write-Host ("B1 cargo test exit: {0}" -f $LASTEXITCODE)
          Write-Host "--- B2: does the bin still link (duplicate-manifest risk)? ---"
          cargo build -p fluxsmith-app --bins 2>&1 | Select-Object -Last 12 | Out-String | Write-Host
          Write-Host ("B2 bin build exit: {0}" -f $LASTEXITCODE)
          git checkout -- src-tauri/build.rs
          Write-Host "build.rs restored"
