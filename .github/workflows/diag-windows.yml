# TEMPORARY DIAGNOSTIC -- delete once the cause is fixed or the step is scoped.
#
# Last resort for the 0xc0000139 (STATUS_ENTRYPOINT_NOT_FOUND) that kills
# `cargo test -p fluxsmith-app --lib` on windows-latest before any test runs.
#
# Ruled out by earlier runs, with evidence: it is not WebView2Loader (absent from
# the import table), it is not DLL shadowing (the only DLLs beside the executable
# are proc-macro crates, none sharing a system name), and every one of the 24
# direct imports resolves to a stock C:\Windows\System32 file. Hand-rolled PE
# parsing produced two wrong answers, so this run does none: it asks the loader
# to name the DLL and the entry point itself.
name: diag-windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo --version
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      - name: Build the test executable
        id: build
        shell: pwsh
        run: |
          $lines = cargo test -p fluxsmith-app --lib --no-run --message-format=json
          $exe = $lines |
            ForEach-Object { try { $_ | ConvertFrom-Json } catch { $null } } |
            Where-Object { $_.reason -eq 'compiler-artifact' -and $_.executable -and $_.target.name -eq 'fluxsmith_app' } |
            Select-Object -Last 1 -ExpandProperty executable
          Write-Host "TEST EXE: $exe"
          "exe=$exe" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Do the debugging tools exist? (state it, do not infer it)
        id: tools
        shell: pwsh
        run: |
          $kit = "${env:ProgramFiles(x86)}\Windows Kits\10\Debuggers\x64"
          foreach ($t in 'cdb.exe','gflags.exe','ntsd.exe') {
            Write-Host ("{0,-12} {1}" -f $t, (Test-Path (Join-Path $kit $t)))
          }
          Write-Host "--- what is actually in that directory ---"
          Get-ChildItem $kit -Filter *.exe -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty Name | ForEach-Object { Write-Host "  $_" }
          "kit=$kit" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Arm loader snaps and let the loader name the failure
        continue-on-error: true
        shell: pwsh
        run: |
          $kit = "${{ steps.tools.outputs.kit }}"
          $exe = "${{ steps.build.outputs.exe }}"
          $leaf = Split-Path -Leaf $exe

          if (Test-Path "$kit\gflags.exe") {
            & "$kit\gflags.exe" -i $leaf +sls
            $key = "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\$leaf"
            Write-Host "--- registry readback (GlobalFlag 0x2 = show loader snaps) ---"
            Get-ItemProperty -Path $key -ErrorAction SilentlyContinue | Format-List | Out-String | Write-Host
          } else { Write-Host "no gflags.exe: loader snaps not armed" }

          if (Test-Path "$kit\cdb.exe") {
            # No `--`: cdb takes the target and its arguments positionally. The previous
            # run passed `--` and produced no output at all.
            Write-Host "--- cdb ---"
            & "$kit\cdb.exe" -c "g;q" $exe --list 2>&1 | ForEach-Object { Write-Host $_ }
            Write-Host "cdb exit: $LASTEXITCODE"
          } else { Write-Host "no cdb.exe" }

      - name: What Windows itself recorded about the crash
        continue-on-error: true
        shell: pwsh
        run: |
          $exe = "${{ steps.build.outputs.exe }}"
          & $exe --list 2>&1 | Out-String | Write-Host
          Write-Host ("direct run exit: {0} (0x{1:x8})" -f $LASTEXITCODE, $LASTEXITCODE)
          Start-Sleep -Seconds 5
          foreach ($log in 'Application','System') {
            Write-Host "--- $log, last 15 entries ---"
            Get-WinEvent -LogName $log -MaxEvents 15 -ErrorAction SilentlyContinue |
              ForEach-Object { Write-Host ("[{0}] {1}: {2}" -f $_.TimeCreated, $_.ProviderName, ($_.Message -replace "`r?`n", ' ' | Select-Object -First 1)) }
          }
