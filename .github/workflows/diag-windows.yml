# TEMPORARY DIAGNOSTIC -- delete once the cause is fixed.
#
# `cargo test -p fluxsmith-app --lib` dies on windows-latest with 0xc0000139
# (STATUS_ENTRYPOINT_NOT_FOUND) before any test runs. Two earlier stories were
# wrong: it is NOT WebView2Loader (the import table does not mention it), and the
# first "no missing entry points" answer was vacuous because the symbol regex
# matched nothing. This run takes three independent shots and uploads every raw
# dump as an artifact so the analysis happens off the log.
name: diag-windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo --version
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      - name: Build the test executable
        id: build
        shell: pwsh
        run: |
          $lines = cargo test -p fluxsmith-app --lib --no-run --message-format=json
          $exe = $lines |
            ForEach-Object { try { $_ | ConvertFrom-Json } catch { $null } } |
            Where-Object { $_.reason -eq 'compiler-artifact' -and $_.executable -and $_.target.name -eq 'fluxsmith_app' } |
            Select-Object -Last 1 -ExpandProperty executable
          Write-Host "TEST EXE: $exe"
          "exe=$exe" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Shot 1 - let the loader say it itself (cdb + loader snaps)
        continue-on-error: true
        shell: pwsh
        run: |
          $out = "$env:RUNNER_TEMP\diag"; New-Item -ItemType Directory -Force -Path $out | Out-Null
          $exe = "${{ steps.build.outputs.exe }}"
          $kit = "${env:ProgramFiles(x86)}\Windows Kits\10\Debuggers\x64"
          "cdb dir exists: $(Test-Path $kit)" | Tee-Object "$out\cdb.txt"
          if (-not (Test-Path "$kit\cdb.exe")) {
            "NO cdb.exe -- shot 1 unavailable" | Tee-Object "$out\cdb.txt" -Append
            Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10" -Directory |
              ForEach-Object { $_.Name } | Out-File "$out\kits.txt"
            exit 0
          }
          # Loader snaps must be armed before process creation; gflags does it per image.
          if (Test-Path "$kit\gflags.exe") {
            & "$kit\gflags.exe" -i (Split-Path -Leaf $exe) +sls 2>&1 | Tee-Object "$out\gflags.txt"
          }
          & "$kit\cdb.exe" -c "g; q" -- $exe --list 2>&1 | Tee-Object "$out\cdb.txt" -Append
          Write-Host "--- lines the loader complained about ---"
          Select-String -Path "$out\cdb.txt" -Pattern 'entry ?point|LDR:|Unable to|0xc0000139|not found' |
            ForEach-Object { Write-Host $_.Line }

      - name: Shot 2 and 3 - full import/export dumps and what the loader resolves
        continue-on-error: true
        shell: pwsh
        run: |
          $out = "$env:RUNNER_TEMP\diag"; New-Item -ItemType Directory -Force -Path $out | Out-Null
          $exe = "${{ steps.build.outputs.exe }}"

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -property installationPath
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul 2>&1 && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { Set-Item -Path "env:$($matches[1])" -Value $matches[2] -ErrorAction SilentlyContinue }
          }
          $db = (Get-Command dumpbin.exe -ErrorAction SilentlyContinue).Source
          "dumpbin: $db" | Tee-Object "$out\tools.txt"
          if (-not $db) { exit 1 }

          # Environment the loader will use.
          $env:PATH -split ';' | Out-File "$out\path.txt"
          Get-ChildItem (Split-Path $exe) -Filter *.dll | Select-Object Name,Length |
            Out-File "$out\exedir-dlls.txt"

          # Transitive walk of the static import graph.
          $resolved = @{}; $queue = New-Object System.Collections.Queue
          $queue.Enqueue($exe)
          $searchDirs = @((Split-Path $exe), "$env:SystemRoot\System32") + ($env:PATH -split ';' | Where-Object { $_ })
          $report = New-Object System.Collections.ArrayList
          $depth = 0
          while ($queue.Count -gt 0 -and $depth -lt 400) {
            $img = $queue.Dequeue(); $depth++
            $key = (Split-Path -Leaf $img).ToLower()
            if ($resolved.ContainsKey($key)) { continue }
            $resolved[$key] = $img
            $raw = & $db /nologo /imports $img 2>&1
            $raw | Out-File "$out\imports-$key.txt"
            $cur = $null
            foreach ($l in $raw) {
              if ($l -match '^\s{2,6}(\S+\.dll)\s*$') { $cur = $matches[1] }
              elseif ($cur -and $l -match '^\s{6,}([0-9A-Fa-f]+)\s+(\S+)\s*$') {
                [void]$report.Add([pscustomobject]@{ Image = $key; Dll = $cur; Symbol = $matches[2] })
              }
            }
            foreach ($d in ($report | Where-Object { $_.Image -eq $key } | Select-Object -ExpandProperty Dll -Unique)) {
              $f = $null
              foreach ($dir in $searchDirs) { $c = Join-Path $dir $d; if (Test-Path $c) { $f = $c; break } }
              if ($f) { $queue.Enqueue($f) } else { "UNRESOLVED $d (needed by $key)" | Out-File "$out\unresolved.txt" -Append }
            }
          }
          $report | Export-Csv -NoTypeInformation "$out\imports.csv"
          "images walked: $($resolved.Count), import records: $($report.Count)" | Tee-Object "$out\tools.txt" -Append

          # Exports of every image the loader would pick, plus its version.
          foreach ($kv in $resolved.GetEnumerator()) {
            $f = $kv.Value
            $v = (Get-Item $f -ErrorAction SilentlyContinue).VersionInfo.FileVersion
            "$($kv.Key)`t$v`t$f" | Out-File "$out\resolved.txt" -Append
            & $db /nologo /exports $f 2>&1 | Out-File "$out\exports-$($kv.Key).txt"
          }
          Write-Host "=== resolved images ==="
          Get-Content "$out\resolved.txt" | ForEach-Object { Write-Host "  $_" }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-loader-diag
          path: ${{ runner.temp }}/diag
          if-no-files-found: warn
