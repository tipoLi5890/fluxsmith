# TEMPORARY DIAGNOSTIC -- delete this file once the cause is fixed.
#
# `cargo test -p fluxsmith-app --lib` dies on windows-latest with exit code
# 0xc0000139 (STATUS_ENTRYPOINT_NOT_FOUND) before a single test runs: the binary
# links, but the loader finds a DLL that lacks an export it imports. The crate
# depends on `tauri`, so the test executable carries WebView2 imports even though
# all 120 lib tests are pure logic. This run answers three things in one trip:
# which (DLL, symbol) pair is missing, which copies of the DLL the runner has and
# what they export, and whether placing the right copy beside the executable is
# enough to make it run.
name: diag-windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo --version
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      - name: Build the test executable without running it
        id: build
        shell: pwsh
        run: |
          $lines = cargo test -p fluxsmith-app --lib --no-run --message-format=json
          $exe = $lines |
            ForEach-Object { try { $_ | ConvertFrom-Json } catch { $null } } |
            Where-Object { $_.reason -eq 'compiler-artifact' -and $_.executable -and $_.target.name -eq 'fluxsmith_app' } |
            Select-Object -Last 1 -ExpandProperty executable
          Write-Host "TEST EXE: $exe"
          "exe=$exe" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Reproduce the failure and report the exit code
        continue-on-error: true
        shell: pwsh
        run: |
          $exe = "${{ steps.build.outputs.exe }}"
          & $exe --list 2>&1 | Out-String | Write-Host
          $code = $LASTEXITCODE
          Write-Host ("EXIT: {0} (0x{1:x8})" -f $code, $code)

      - name: Import table vs what the loader would actually resolve
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $exe = "${{ steps.build.outputs.exe }}"

          # dumpbin needs its own VC environment or it exits silently producing nothing,
          # which is exactly what the previous run did. Import vcvars64 into this shell.
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -property installationPath
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          Write-Host "vcvars: $vcvars (exists: $(Test-Path $vcvars))"
          cmd /c "`"$vcvars`" >nul 2>&1 && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { Set-Item -Path "env:$($matches[1])" -Value $matches[2] -ErrorAction SilentlyContinue }
          }
          $db = (Get-Command dumpbin.exe -ErrorAction SilentlyContinue).Source
          Write-Host "dumpbin on PATH: $db"
          if (-not $db) { Write-Host "STILL NO WORKING DUMPBIN"; exit 1 }

          Write-Host "===== raw /imports (first 200 lines) ====="
          $raw = & $db /nologo /imports $exe 2>&1
          $raw | Select-Object -First 200 | ForEach-Object { Write-Host $_ }

          # Parse the import table into DLL -> imported names.
          $imports = @{}; $cur = $null
          foreach ($line in $raw) {
            if ($line -match '^\s{4}(\S+\.dll)\s*$') { $cur = $matches[1]; $imports[$cur] = New-Object System.Collections.ArrayList; continue }
            if ($cur -and $line -match '^\s+[0-9A-Fa-f]{8,16}\s+(?:[0-9A-Fa-f]+\s+)?([A-Za-z_][A-Za-z0-9_@\?$]*)\s*$') {
              [void]$imports[$cur].Add($matches[1])
            }
          }
          Write-Host ""
          Write-Host "===== parsed: $($imports.Keys.Count) DLLs ====="
          foreach ($d in $imports.Keys | Sort-Object) { Write-Host ("  {0,-40} {1} names" -f $d, $imports[$d].Count) }

          # For each DLL, find the file the loader would use and diff names against its exports.
          $searchDirs = @((Split-Path $exe), "$env:SystemRoot\System32") + ($env:PATH -split ';' | Where-Object { $_ })
          Write-Host ""
          Write-Host "===== MISSING ENTRY POINTS ====="
          $found = $false
          foreach ($d in $imports.Keys | Sort-Object) {
            $file = $null
            foreach ($dir in $searchDirs) {
              $c = Join-Path $dir $d
              if (Test-Path $c) { $file = $c; break }
            }
            if (-not $file) { Write-Host "  $d -> NOT FOUND on the search path"; $found = $true; continue }
            $ex = & $db /nologo /exports $file 2>&1
            $names = @{}
            foreach ($l in $ex) { if ($l -match '^\s+\d+\s+[0-9A-Fa-f]+\s+[0-9A-Fa-f]{8}\s+(\S+)') { $names[$matches[1]] = $true } }
            $missing = $imports[$d] | Where-Object { -not $names.ContainsKey($_) }
            if ($missing) {
              $found = $true
              Write-Host "  $d  (resolves to $file, $($names.Count) exports)"
              foreach ($m in $missing) { Write-Host "      MISSING: $m" }
            }
          }
          if (-not $found) { Write-Host "  none - every imported name is exported by the file the loader would pick" }
