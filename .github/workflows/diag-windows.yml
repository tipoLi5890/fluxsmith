# TEMPORARY DIAGNOSTIC -- delete once a fix lands.
#
# Cause, established by the loader itself under loader snaps:
#   LdrpReportError - ERROR: Locating export "TaskDialogIndirect" for DLL
#   "...\deps\fluxsmith_app-<hash>.exe" failed with status: 0xc0000139
# TaskDialogIndirect exists only in side-by-side Common-Controls 6; System32 has
# comctl32 5.82. The test harness carries no manifest asking for 6, because
# tauri-build embeds one with rustc-link-arg-bins, which never reaches a test
# binary. rustc-link-arg-tests is not the answer either: it covers tests/ only,
# and cargo rejects it outright for a package with no test target.
#
# Two candidates, tried here rather than on main.
name: diag-windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidates:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo --version
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      - name: Candidate A - an external .manifest beside the test executable
        continue-on-error: true
        shell: pwsh
        run: |
          $lines = cargo test -p fluxsmith-app --lib --no-run --message-format=json
          $exe = $lines |
            ForEach-Object { try { $_ | ConvertFrom-Json } catch { $null } } |
            Where-Object { $_.reason -eq 'compiler-artifact' -and $_.executable -and $_.target.name -eq 'fluxsmith_app' } |
            Select-Object -Last 1 -ExpandProperty executable
          Write-Host "exe: $exe"

          # Windows reads <module>.manifest from the module's own directory when the
          # module has no embedded manifest, which a Rust test harness never has.
          $mf = "$exe.manifest"
          @'
<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<assembly xmlns="urn:schemas-microsoft-com:asm.v1" manifestVersion="1.0">
  <dependency>
    <dependentAssembly>
      <assemblyIdentity type="win32" name="Microsoft.Windows.Common-Controls"
                        version="6.0.0.0" processorArchitecture="*"
                        publicKeyToken="6595b64144ccf1df" language="*"/>
    </dependentAssembly>
  </dependency>
</assembly>
'@ | Set-Content -Path $mf -Encoding UTF8
          Write-Host "wrote $mf"
          & $exe --list 2>&1 | Select-Object -First 3 | Out-String | Write-Host
          $code = $LASTEXITCODE
          Write-Host ("A EXIT: {0} (0x{1:x8})" -f $code, $code)
          if ($code -eq 0) { Write-Host "A WORKS" } else { Write-Host "A FAILS" }

      - name: Candidate B - rustc-link-arg for all targets, and does the bin still link
        continue-on-error: true
        shell: pwsh
        run: |
          # Patch build.rs in place; never committed, restored at the end.
          $patch = @'
// SPDX-License-Identifier: Apache-2.0
fn main() {
    if std::env::var("CARGO_CFG_TARGET_OS").as_deref() == Ok("windows")
        && std::env::var("CARGO_CFG_TARGET_ENV").as_deref() == Ok("msvc")
    {
        const MANIFEST: &str = r#"<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<assembly xmlns="urn:schemas-microsoft-com:asm.v1" manifestVersion="1.0">
  <dependency>
    <dependentAssembly>
      <assemblyIdentity type="win32" name="Microsoft.Windows.Common-Controls"
                        version="6.0.0.0" processorArchitecture="*"
                        publicKeyToken="6595b64144ccf1df" language="*"/>
    </dependentAssembly>
  </dependency>
</assembly>
"#;
        let out = std::path::PathBuf::from(std::env::var("OUT_DIR").unwrap())
            .join("common-controls-v6.manifest");
        std::fs::write(&out, MANIFEST).unwrap();
        println!("cargo:rustc-link-arg=/MANIFEST:EMBED");
        println!("cargo:rustc-link-arg=/MANIFESTINPUT:{}", out.display());
    }
    tauri_build::build()
}
'@
          Set-Content -Path src-tauri/build.rs -Value $patch -Encoding UTF8

          Write-Host "--- B1: does the lib test harness now run? ---"
          cargo test -p fluxsmith-app --lib 2>&1 | Select-Object -Last 12 | Out-String | Write-Host
          Write-Host ("B1 cargo test exit: {0}" -f $LASTEXITCODE)

          Write-Host "--- B2: does the bin still link (the duplicate-manifest risk)? ---"
          cargo build -p fluxsmith-app --bins 2>&1 | Select-Object -Last 12 | Out-String | Write-Host
          Write-Host ("B2 bin build exit: {0}" -f $LASTEXITCODE)

          git checkout -- src-tauri/build.rs
          Write-Host "build.rs restored"
