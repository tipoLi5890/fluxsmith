[package]
name = "fluxsmith-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
license = "Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
kicad-sexpr = { path = "../crates/kicad-sexpr" }
sch-read = { path = "../crates/sch-read" }

[[bin]]
name = "kicad_sexpr_parse"
